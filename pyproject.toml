[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "appium-connect-agent"
version = "0.1.0"
description = "Python project foundation for Appium agent integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "anyio==4.15.1",
    "httpcore==1.0.9",
    "node-semver==0.9.1",
]

[dependency-groups]
dev = [
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
source-include = ["typings/nodesemver/__init__.pyi"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_package = "appium_connect_agent"

[[tool.importlinter.contracts]]
name = "Contracts cannot depend on Runtime"
type = "forbidden"
source_modules = ["appium_connect_agent.contracts"]
forbidden_modules = ["appium_connect_agent.runtime"]

[[tool.importlinter.contracts]]
name = "Configuration cannot depend on Runtime"
type = "forbidden"
source_modules = ["appium_connect_agent.configuration"]
forbidden_modules = ["appium_connect_agent.runtime"]

[[tool.importlinter.contracts]]
name = "Contracts cannot depend on Configuration"
type = "forbidden"
source_modules = ["appium_connect_agent.contracts"]
forbidden_modules = ["appium_connect_agent.configuration"]
