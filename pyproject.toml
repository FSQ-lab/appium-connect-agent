[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "appium-connect-agent"
version = "0.1.0"
description = "Local Appium readiness and automation for AI agent integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "anyio==4.15.1",
    "httpcore==1.0.9",
    "node-semver==0.9.1",
    "Appium-Python-Client==6.0.8",
    "selenium==4.51.0",
    "defusedxml==0.7.1",
    "mcp==2.3.0",
    "pydantic==2.14.1",
]

[project.scripts]
appium-connect-agent-mcp = "appium_connect_agent.integrations._server:main"

[dependency-groups]
dev = [
    "import-linter",
    "mypy",
    "pytest",
    "ruff",
    "types-defusedxml==0.7.0.20260504",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
explicit = true

[[tool.uv.index]]
name = "corporate"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.uv.sources]
Appium-Python-Client = { index = "tsinghua" }

[tool.uv.build-backend]
source-include = ["typings/nodesemver/__init__.pyi"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_package = "appium_connect_agent"

[[tool.importlinter.contracts]]
name = "Contracts cannot depend on Runtime"
type = "forbidden"
source_modules = ["appium_connect_agent.contracts"]
forbidden_modules = ["appium_connect_agent.runtime"]

[[tool.importlinter.contracts]]
name = "Configuration cannot depend on Runtime"
type = "forbidden"
source_modules = ["appium_connect_agent.configuration"]
forbidden_modules = ["appium_connect_agent.runtime"]

[[tool.importlinter.contracts]]
name = "Contracts cannot depend on Configuration"
type = "forbidden"
source_modules = ["appium_connect_agent.contracts"]
forbidden_modules = ["appium_connect_agent.configuration"]

[[tool.importlinter.contracts]]
name = "Automation cannot depend on Configuration"
type = "forbidden"
source_modules = ["appium_connect_agent.automation"]
forbidden_modules = ["appium_connect_agent.configuration"]

[[tool.importlinter.contracts]]
name = "Lower-level modules cannot depend on Automation"
type = "forbidden"
source_modules = [
    "appium_connect_agent.contracts",
    "appium_connect_agent.configuration",
    "appium_connect_agent.runtime",
]
forbidden_modules = ["appium_connect_agent.automation"]

[[tool.importlinter.contracts]]
name = "Lower-level modules cannot depend on Integrations"
type = "forbidden"
source_modules = [
    "appium_connect_agent.contracts",
    "appium_connect_agent.configuration",
    "appium_connect_agent.runtime",
    "appium_connect_agent.automation",
]
forbidden_modules = ["appium_connect_agent.integrations"]
